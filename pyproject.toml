[project]
name = "efficient-llm"
version = "0.1.0"
description = "Compare 2-3B parameter models on the efficient frontier"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "torch>=2.0",
    "transformers>=4.36",
    "accelerate>=0.25",
    "bitsandbytes>=0.41",
    "datasets>=2.16",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest", "black", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
